name: Update free nodes

on:
  schedule:
    - cron: "0 * * * *"   # 姣忓皬鏃舵暣鐐硅繍琛屼竴娆★紙鑺傜偣澶辨晥蹇紝棰戠巼鍙互鍐嶈皟楂橈級
  workflow_dispatch:        # 鍏佽鎵嬪姩瑙﹀彂

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and merge nodes
        run: python fetch_nodes.py --test

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && echo "鏃犲彉鍖栵紝璺宠繃鎻愪氦" && exit 0
          git commit -m "$(date -u '+%Y-%m-%d %H:%M:%S') 鏇存柊鑺傜偣"
          git push
